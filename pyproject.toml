[project]
name = "knowledge-base"
version = "0.1.0"
description = "个人知识库：需求、设计、技术方案，以及约束这些文档的自动检查"
requires-python = ">=3.10"
dependencies = ["pg8000>=1.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "pre-commit>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kb", "kb.store", "tools", "tools.doc_checks"]

[tool.setuptools.package-data]
"kb.store" = ["migrations/*.sql", "migrations/README.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# -ra：跳过与失败的原因始终打印。缺了它，一次「全跳过」在 -q 下只剩
# 16 个 s，看不出为什么，等于把事故藏起来（2026-11-26 真踩过）。
addopts = "-ra"
markers = [
    "slow: 慢检查，PR 上不跑，合进 main 之后跑",
    "pg: 需要真实 Postgres，未设置 KB_PG_* 时自动 skip",
]

[tool.ruff]
line-length = 88
# 文档里的 Python 示例块不参与格式化：它们是说明书的一部分，
# 手写对齐是为了可读性，ruff 自动改会破坏阅读顺序。
extend-exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
