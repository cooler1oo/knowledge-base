[project]
name = "knowledge-base"
version = "0.1.0"
description = "个人知识库：需求、设计、技术方案，以及约束这些文档的自动检查"
requires-python = ">=3.11"
dependencies = [
    "pg8000>=1.31",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "bcrypt>=5.0",
    # 抓取层主选。锁 2.4.x：2.4.4 是 R0 在平板上实测可用的版本，
    # 大版本升级要重跑 R3 的真机抓取测试（抖音解析器改版风险高，见技术方案 §4.8）
    "parsehub>=2.4.4,<2.5",
    # AI 层发一次 OpenAI 兼容请求。必须显式声明：本机的 httpx 是 parsehub 的
    # 传递依赖（实测 0.28.1，Required-by 是 f2 与 parsehub），换干净机器或
    # parsehub 升级后 `import httpx` 就可能失败，表现为 worker 起不来。
    # 锁 0.28 下界是因为 trust_env=False 与 Timeout(connect=, read=) 的签名
    # 在该版本实测过；不锁上界（1.x 未发布，锁上界会挡住升级）。
    "httpx>=0.28",
    # 视觉链路（P2）。**必须是 0.6.6，不能升 0.7.x**：
    # 0.7.0 起 METADATA 里 `Requires-Dist: opencv-python` 是无条件依赖
    # （pip install --dry-run 实测 0.7.0/0.7.1/0.7.2/0.7.3 都拉 opencv-python 5.1.0.95），
    # 而 GUI 版 opencv 在无桌面的 proot 容器里 import cv2 直接失败（需要 libxcb.so.1）。
    # 0.6.6 把 opencv 放进 extras（opencv / opencv-headless），
    # Requires-Dist 只剩 Click / numpy / platformdirs / tqdm，我们显式声明 headless 版。
    # 0.6.6 顶层不 import click（实测 import scenedetect 后 sys.modules 里没有 click），
    # tqdm 是 try/except 可选导入，缺了用 FakeTqdmObject 顶上。
    "scenedetect>=0.6.6,<0.7",
    # **不许装 opencv-python（GUI 版）**：与 headless 共用 site-packages/cv2/ 目录，
    # 两者同时存在时 GUI 版覆盖 __init__（本机实测 getBuildInformation() 从
    # GUI: NONE 变成 GUI: WIN32UI），此时 pip uninstall opencv-python 会把
    # cv2/ 里的文件一起删掉，headless 版仍在 pip list 里但 import cv2 变成
    # ModuleNotFoundError（本机已复现）。所以只能显式钉 headless 版，
    # 并保证没有任何包把 GUI 版带进来。
    "opencv-python-headless>=4.8",
    # 媒体层的图片归一化压缩（PRD §5.5「统一压缩，单张 ≤ 200KB」）。
    # **必须显式声明**：Pillow 当前是 parsehub 的传递依赖（本机实测 13.0.0），
    # 换干净机器或 parsehub 升级后 `from PIL import Image` 就可能失败，表现为
    # 「所有封面都存不下来」而抓取全部正常——与 httpx 记的是同一个教训。
    # 不锁上界：`Image.open` / `save` / `thumbnail` 三个接口在 13 实测可用，
    # 而 `encode.py` 的 Protocol 隔离让升级影响面只有一处。
    "pillow>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # 抓取层是异步的，没有它 async def test_* 会报
    # "async def functions are not natively supported" 而全部失败。
    # 2026-11-27 CI 踩过：本地环境恰好装了 0.25.0 所以本地绿，
    # CI 干净环境没装 → 11 个异步测试全挂。
    "pytest-asyncio>=0.24",
    "ruff>=0.17",
    "mypy>=2",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# kb.vision 不登记时 `pip install -e .` 装出来的包缺这个目录：测试靠
# pythonpath = ["."] 照跑得通，只有部署到平板后 `import kb.vision` 才失败。
packages = [
    "kb",
    "kb.ai",
    "kb.asr",
    "kb.media",
    # kb.search 与 kb.vision 记的是同一个教训：不登记时 `pip install -e .`
    # 装出来的包缺这个目录，测试靠 pythonpath 照跑得通，只有部署到平板后
    # `import kb.search` 才失败。
    "kb.search",
    "kb.store",
    "kb.vision",
    "tools",
    "tools.doc_checks",
]

[tool.setuptools.package-data]
"kb.store" = ["migrations/*.sql", "migrations/README.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# -ra：跳过与失败的原因始终打印。缺了它，一次「全跳过」在 -q 下只剩
# 16 个 s，看不出为什么，等于把事故藏起来（2026-11-26 真踩过）。
addopts = "-ra -m 'not external'"
markers = [
    "slow: 慢检查，PR 上不跑，合进 main 之后跑",
    "pg: 需要真实 Postgres，未设置 KB_PG_* 时自动 skip",
    "external: 需要真实外网与第三方站点可用性，默认不跑；用 -m external 显式跑",
]
# 这两个必须放在 ini_options 里：写成 [tool.pytest_asyncio] 是读不到的
# （2026-11-27 踩过，警告一直在但测试照样绿，容易被忽略）。
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
# 文档里的 Python 示例块不参与格式化：它们是说明书的一部分，
# 手写对齐是为了可读性，ruff 自动改会破坏阅读顺序。
# deliverables/ 与 docs/ 性质相同，都是给人读的文档（交付记录、交接包），
# 里面同样有 Python 示例块。2026-11-28 只排除 docs/ 时，一份交接文档
# 里的示例块被 ruff format 改写，提交被拦下——漏的是目录，不是格式。
extend-exclude = ["docs/**", "deliverables/**"]

[tool.ruff.lint]
# T20 = 禁 print。产品代码要用日志，print 只会进 stdout 没人收。
select = ["E4", "E7", "E9", "F", "I", "T20", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# CLI 入口的输出就是 print，这是它们的职责，不是违规
"tools/**" = ["T20"]
"scripts/**" = ["T20"]
"kb/store/migrate.py" = ["T20"]

# 类型检查：这一层只保证「明显的空值与类型错用」能被拦下。
# pg8000 没有官方 stub，故 ignore_missing_imports；等上游有了再收紧。
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
# 函数必须写注解。不开这条时，新代码可以整篇不写类型而照样通过——
# 「类型系统拦住空值漏判」就成了空话（2026-11-27 打开，代价 4 处已补）。
disallow_untyped_defs = true
# 半注解也要拦：`def f(x) -> int:` 这种只写返回值的，等于把参数类型交给 Any。
disallow_incomplete_defs = true
# 声明返回 bool 却把 Any 直接抛回去的，必须显式收口（2026-11-27 抓到 1 处真问题）。
warn_return_any = true
strict_equality = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^docs/", "^demo/"]

[tool.coverage.run]
source = ["kb"]
omit = ["kb/store/migrate.py"]  # 迁移器的主体逻辑在真库里跑，单测覆盖不到

[tool.coverage.report]
show_missing = true
# 实测 57%（2026-11-26），阈值取 55：红了说明真的掉了，不是噪声。
# 想提高就补测试，不要调阈值。
fail_under = 55
