[project]
name = "knowledge-base"
version = "0.1.0"
description = "个人知识库：需求、设计、技术方案，以及约束这些文档的自动检查"
requires-python = ">=3.11"
dependencies = ["pg8000>=1.31", "starlette>=1.0", "uvicorn>=0.30", "bcrypt>=5.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17",
    "mypy>=2",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kb", "kb.store", "tools", "tools.doc_checks"]

[tool.setuptools.package-data]
"kb.store" = ["migrations/*.sql", "migrations/README.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# -ra：跳过与失败的原因始终打印。缺了它，一次「全跳过」在 -q 下只剩
# 16 个 s，看不出为什么，等于把事故藏起来（2026-11-26 真踩过）。
addopts = "-ra"
markers = [
    "slow: 慢检查，PR 上不跑，合进 main 之后跑",
    "pg: 需要真实 Postgres，未设置 KB_PG_* 时自动 skip",
]

[tool.ruff]
line-length = 88
# 文档里的 Python 示例块不参与格式化：它们是说明书的一部分，
# 手写对齐是为了可读性，ruff 自动改会破坏阅读顺序。
extend-exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# 类型检查：这一层只保证「明显的空值与类型错用」能被拦下。
# pg8000 没有官方 stub，故 ignore_missing_imports；等上游有了再收紧。
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
# 函数必须写注解。不开这条时，新代码可以整篇不写类型而照样通过——
# 「类型系统拦住空值漏判」就成了空话（2026-11-27 打开，代价 4 处已补）。
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^docs/", "^demo/"]

[tool.coverage.run]
source = ["kb"]
omit = ["kb/store/migrate.py"]  # 迁移器的主体逻辑在真库里跑，单测覆盖不到

[tool.coverage.report]
show_missing = true
# 实测 57%（2026-11-26），阈值取 55：红了说明真的掉了，不是噪声。
# 想提高就补测试，不要调阈值。
fail_under = 55
