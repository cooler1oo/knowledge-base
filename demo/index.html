<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 · Demo</title>
<style>
:root{
  --bg:#100f0d; --panel:#171613; --card:#1c1a17; --card2:#242119;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.14);
  --text:#e9e5dc; --dim:#a09a8d; --dim2:#6d685f;
  --accent:#c9a227; --accentsoft:rgba(201,162,39,.13);
  --r:12px; --dockh:66px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}

.main{height:100vh;display:flex;flex-direction:column;min-width:0}

/* ---------- 顶栏 ---------- */
.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:16px;
  padding:0 24px;border-bottom:1px solid var(--border);
}
.tb-brand{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim2);white-space:nowrap}
.tb-brand .dot{width:8px;height:8px;border-radius:2.5px;background:var(--accent)}
.tb-page{
  font-size:15px;font-weight:500;color:var(--text);padding-left:15px;
  border-left:1px solid var(--border);white-space:nowrap;
}
.search{
  flex:1;max-width:520px;display:flex;align-items:center;gap:9px;
  background:var(--card);border:1px solid var(--border);border-radius:9px;
  padding:0 12px;height:34px;transition:border-color .15s;margin:0 auto;
}
.search:focus-within{border-color:var(--border2)}
.search input{flex:1;background:none;border:none;outline:none;font-size:13.5px;color:var(--text)}
.search input::placeholder{color:var(--dim2)}
.kbd{font-size:10.5px;color:var(--dim2);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.btn-ghost{
  height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border);
  color:var(--dim);font-size:12.5px;transition:.15s;white-space:nowrap;
}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}

.scroll{flex:1;overflow-y:auto;padding:20px 24px calc(var(--dockh) + 28px)}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:5px}

/* ---------- 页面骨架：主区 + 页内侧栏 ---------- */
.page{display:grid;grid-template-columns:190px minmax(0,1fr);gap:26px;align-items:start}
.page-side{
  position:sticky;top:0;max-height:calc(100vh - var(--dockh) - 100px);
  overflow-y:auto;padding-right:4px;
}
.page-side::-webkit-scrollbar{width:5px}
.page-side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:3px}
.page-main{min-width:0}

.nav-title{font-size:11px;color:var(--dim2);letter-spacing:.8px;padding:0 8px 7px}
.nav-group{margin-bottom:18px}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;
  border-radius:7px;font-size:13.5px;color:var(--dim);text-align:left;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:rgba(255,255,255,.045);color:var(--text)}
.nav-item.on{background:var(--accentsoft);color:var(--accent)}
.nav-item .cnt{margin-left:auto;font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.nav-item.on .cnt{color:var(--accent);opacity:.75}
.nav-item .caret{font-size:10px;color:var(--dim2)}
.nav-sub{padding-left:18px}
.side-note{font-size:11.5px;color:var(--dim2);padding:2px 8px 8px;line-height:1.6}

/* ---------- 底部 dock ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;height:var(--dockh);z-index:45;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 22px;gap:16px;
  background:rgba(20,19,17,.94);border-top:1px solid var(--border);
  backdrop-filter:blur(14px);
}
.dock-status{
  font-size:11.5px;color:var(--dim2);justify-self:start;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.dock-status b{color:var(--dim);font-weight:500}
.dock-nav{display:flex;gap:4px;justify-self:center}
.dock-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 18px;border-radius:10px;color:var(--dim2);
  transition:background .14s,color .14s;position:relative;
  flex:0 0 auto;
}
.dock-btn svg{display:block}
.dock-btn span{font-size:11px;letter-spacing:.2px;white-space:nowrap}
.dock-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.dock-btn.on{color:var(--accent);background:var(--accentsoft)}
.dock-btn.on::after{
  content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  width:18px;height:2px;border-radius:2px;background:var(--accent);
}
.dock-actions{justify-self:end}
.btn-add{
  background:var(--accent);color:#1a1508;font-weight:500;font-size:13px;
  padding:0 16px;height:36px;border-radius:9px;transition:filter .15s;
}
.btn-add:hover{filter:brightness(1.08)}

/* ---------- 卡片 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:transform .16s,border-color .16s,background .16s;
  animation:fade .28s ease both;
}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-2px);border-color:var(--border2);background:var(--card2)}
.cover{position:relative;aspect-ratio:16/10;overflow:hidden}
.cover::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 75% 10%,rgba(255,255,255,.14),transparent 60%);
}
.cover .badge{
  position:absolute;left:9px;top:9px;z-index:2;font-size:10.5px;letter-spacing:.4px;
  padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.42);color:#f0ece3;
}
.cover .dur{
  position:absolute;right:9px;bottom:9px;z-index:2;font-size:10.5px;
  padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.48);color:#f0ece3;
  font-variant-numeric:tabular-nums;
}
.card-body{padding:11px 13px 13px}
.card-title{
  font-size:13.5px;font-weight:500;line-height:1.5;height:2.99em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.card-sum{
  font-size:12px;color:var(--dim);line-height:1.62;margin-top:6px;height:3.24em;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--dim2)}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{
  font-size:10.5px;padding:1.5px 7px;border-radius:5px;
  background:rgba(255,255,255,.055);color:var(--dim);
}
.tag.ai{background:rgba(201,162,39,.11);color:#c9a227}
.tag.none{background:rgba(210,110,90,.13);color:#d2836e}
.sep{width:2px;height:2px;border-radius:50%;background:var(--dim2)}

.skeleton{background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);
  background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.processing .cover{background:var(--card2)!important}
.processing .cover::after{display:none}
.proc-label{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--dim);gap:8px;z-index:3;
}
.spin{width:12px;height:12px;border:1.5px solid var(--dim2);border-top-color:var(--accent);
  border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* 列表头 */
.list-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.list-title{font-size:15px;font-weight:500}
.list-sub{font-size:12px;color:var(--dim2)}
.list-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{padding:4px 11px;font-size:12.5px;color:var(--dim);border-radius:6px}
.seg button.on{background:var(--card2);color:var(--text)}

.tl-group{margin-bottom:26px}
.tl-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--dim2)}
.tl-head .line{flex:1;height:1px;background:var(--border)}
.tl-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tl-row .card-title{font-size:13px}

/* ---------- 主页 ---------- */
.home-hero{padding:4px 2px 24px}
.hero-greet{font-size:23px;font-weight:500;letter-spacing:.3px}
.hero-sub{font-size:13px;color:var(--dim2);margin-top:7px}
.hero-sub b{color:var(--accent);font-weight:500}
.home-sec{margin-bottom:30px}
.home-sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:13px}
.home-sec-title{font-size:14px;font-weight:500}
.home-sec-note{font-size:11.5px;color:var(--dim2)}
.home-sec-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.rand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:18px}
.big-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  cursor:pointer;transition:transform .16s,border-color .16s,background .16s;
  animation:fade .3s ease both;display:flex;flex-direction:column;
}
.big-card:hover{transform:translateY(-3px);border-color:var(--border2);background:var(--card2)}
.big-card .cover{aspect-ratio:16/9}
.big-card .card-body{padding:14px 15px 16px;flex:1;display:flex;flex-direction:column}
.big-card .card-title{font-size:15px;height:auto;-webkit-line-clamp:2}
.big-card .card-sum{font-size:12.5px;height:4.86em;-webkit-line-clamp:3;margin-top:8px}
.big-card .card-meta{margin-top:auto;padding-top:10px}

.heat-wrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.heat{display:flex;gap:3px;padding:2px 0}
.heat-col{display:flex;flex-direction:column;gap:3px}
.heat-cell{width:11px;height:11px;border-radius:2.5px;background:rgba(255,255,255,.035)}
.heat-cell.l1{background:rgba(201,162,39,.18)}
.heat-cell.l2{background:rgba(201,162,39,.34)}
.heat-cell.l3{background:rgba(201,162,39,.52)}
.heat-cell.l4{background:rgba(201,162,39,.78)}
.heat-legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim2);margin-top:9px}
.heat-legend .heat-cell{width:9px;height:9px}
.heat-link{
  border:1px solid var(--border);border-radius:9px;padding:8px 14px;font-size:12.5px;
  color:var(--dim);transition:.15s;white-space:nowrap;
}
.heat-link:hover{border-color:var(--border2);color:var(--text)}

/* ---------- 日历 ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.cal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px 18px}
.cal-monthhead{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.cal-monthhead .m{font-size:14px;font-weight:500}
.cal-monthhead .n{font-size:11.5px;color:var(--dim2)}
.cal-weekhead{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-weekhead span{font-size:10.5px;color:var(--dim2);text-align:center;letter-spacing:.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{
  height:62px;border-radius:8px;background:rgba(255,255,255,.03);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  padding:6px 9px;cursor:pointer;position:relative;
  border:1px solid transparent;transition:border-color .13s,background .13s,transform .13s;
}
.cal-cell:hover{border-color:var(--border2);transform:translateY(-1px)}
.cal-cell.blank{background:none;cursor:default;border-color:transparent}
.cal-cell.blank:hover{transform:none;border-color:transparent}
.cal-cell.l1{background:rgba(201,162,39,.11)}
.cal-cell.l2{background:rgba(201,162,39,.22)}
.cal-cell.l3{background:rgba(201,162,39,.36)}
.cal-cell.l4{background:rgba(201,162,39,.55)}
.cal-num{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.cal-cell.l2 .cal-num,.cal-cell.l3 .cal-num,.cal-cell.l4 .cal-num{color:var(--text)}
.cal-cnt{font-size:10px;color:var(--dim2);font-variant-numeric:tabular-nums}
.cal-cell.l3 .cal-cnt,.cal-cell.l4 .cal-cnt{color:rgba(26,21,8,.65)}
.cal-cell.today .cal-num{color:var(--accent);font-weight:500}
.cal-cell.today::before{
  content:"";position:absolute;right:8px;top:9px;width:6px;height:6px;
  border-radius:50%;background:var(--accent);
}
.cal-cell.sel{border-color:var(--accent);border-width:2px;padding:5px 8px}

.cal-side{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 16px 8px}
.cal-side-head{display:flex;align-items:baseline;gap:9px;padding-bottom:11px;border-bottom:1px solid var(--border)}
.cal-side-date{font-size:14px;font-weight:500}
.cal-side-cnt{font-size:11.5px;color:var(--dim2);margin-left:auto}
.cal-list{max-height:430px;overflow-y:auto}
.cal-list::-webkit-scrollbar{width:6px}
.cal-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.cal-row{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.cal-row:last-child{border-bottom:none}
.cal-row:hover .cal-row-title{color:var(--accent)}
.cal-thumb{width:54px;height:37px;border-radius:6px;flex:0 0 54px;position:relative;overflow:hidden}
.cal-thumb span{
  position:absolute;left:0;top:0;font-size:8.5px;padding:1px 4px;
  background:rgba(0,0,0,.45);color:#f0ece3;border-radius:0 0 4px 0;
}
.cal-row-body{min-width:0;flex:1}
.cal-row-title{
  font-size:12.5px;line-height:1.45;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  transition:color .13s;
}
.cal-row-meta{font-size:10.5px;color:var(--dim2);margin-top:4px}
.cal-empty{padding:30px 0;text-align:center;font-size:12.5px;color:var(--dim2)}

/* ---------- 抽屉 ---------- */
.drawer-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40;
}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--panel);
  border-left:1px solid var(--border);transform:translateX(100%);
  transition:transform .26s cubic-bezier(.3,.8,.3,1);z-index:41;
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer-scroll{flex:1;overflow-y:auto}
.drawer-scroll::-webkit-scrollbar{width:8px}
.drawer-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.d-cover{position:relative;height:220px}
.d-cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,var(--panel),transparent 55%)}
.d-close{
  position:absolute;right:12px;top:12px;z-index:5;width:30px;height:30px;border-radius:8px;
  background:rgba(0,0,0,.45);color:#f0ece3;font-size:16px;line-height:1;
}
.d-body{padding:0 24px 28px;margin-top:-26px;position:relative;z-index:3}
.d-title{font-size:19px;font-weight:500;line-height:1.45;letter-spacing:.2px}
.d-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;font-size:12px;color:var(--dim2);align-items:center}
.d-sect-title{font-size:11px;color:var(--dim2);letter-spacing:.7px;margin:22px 0 8px}
.d-sum{
  font-size:13.5px;line-height:1.75;color:#cfc9bd;background:var(--card);
  border:1px solid var(--border);border-radius:10px;padding:13px 14px;
}
.d-tags{display:flex;flex-wrap:wrap;gap:6px}
.d-tags .tag{font-size:11.5px;padding:3px 9px;border-radius:6px}
.d-tags .tag.add{border:1px dashed var(--border2);color:var(--dim2);cursor:pointer;background:none}
.props{width:100%;border-collapse:collapse;font-size:12.5px}
.props td{padding:7px 0;border-bottom:1px solid var(--border);color:var(--dim)}
.props td:first-child{width:88px;color:var(--dim2)}
.props td:last-child{text-align:right;color:var(--text)}
.d-actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.btn-primary{background:var(--accent);color:#1a1508;font-weight:500;font-size:13px;padding:9px 16px;border-radius:9px}
.btn-line{
  padding:9px 14px;border-radius:9px;border:1px solid var(--border2);
  font-size:13px;color:var(--dim);transition:.15s;
}
.btn-line:hover{color:var(--text);border-color:rgba(255,255,255,.24)}
.btn-line.danger:hover{color:#e08b76;border-color:rgba(224,139,118,.4)}
select.type-sel{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:8px 10px;font-size:13px;outline:none;
}

/* ---------- 弹窗 / toast ---------- */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;
  justify-content:center;padding-top:14vh;opacity:0;pointer-events:none;transition:opacity .18s;z-index:50;
}
.modal-mask.on{opacity:1;pointer-events:auto}
.modal{
  width:min(520px,92vw);background:var(--panel);border:1px solid var(--border2);
  border-radius:14px;padding:22px;transform:translateY(-8px);transition:transform .2s;
}
.modal-mask.on .modal{transform:none}
.modal h3{font-size:15px;font-weight:500;margin-bottom:4px}
.modal p.hint{font-size:12.5px;color:var(--dim2);margin-bottom:14px}
.modal textarea{
  width:100%;height:84px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px;font-size:13.5px;resize:none;outline:none;line-height:1.6;
}
.modal textarea:focus{border-color:var(--border2)}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}

.toast-wrap{position:fixed;left:50%;bottom:calc(var(--dockh) + 22px);transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:#2a261d;border:1px solid var(--border2);color:var(--text);
  font-size:12.5px;padding:9px 16px;border-radius:9px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);animation:up .22s ease both;
}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

mark{background:rgba(201,162,39,.28);color:#f3e9c8;border-radius:2px;padding:0 1px}
.empty{padding:70px 0;text-align:center;color:var(--dim2);font-size:13px}

.side-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:59;display:none;
}
.side-mask.on{opacity:1;pointer-events:auto}
.only-mobile{display:none}
.t-short{display:none}

@media (max-width:1000px){
  .page{grid-template-columns:1fr}
  .cal-wrap{grid-template-columns:1fr}
  .only-mobile{display:inline-flex;align-items:center}
  .side-mask{display:block}
  .page-side{
    position:fixed;left:0;top:0;bottom:0;width:252px;z-index:60;background:var(--panel);
    transform:translateX(-100%);transition:transform .24s cubic-bezier(.3,.8,.3,1);
    padding:18px 12px calc(var(--dockh) + 16px);max-height:none;overflow-y:auto;
    border-right:1px solid var(--border);box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  .page-side.on{transform:none}
}
@media (max-width:860px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:12px}
  .card-sum{display:none}
  .card-title{font-size:12.5px}
  .card-body{padding:10px 11px 11px}
  .scroll{padding:14px 14px calc(var(--dockh) + 24px)}
  .topbar{padding:0 12px;gap:10px}
  .tb-brand{display:none}
  .tb-page{border-left:none;padding-left:0;font-size:14px}
  .search{max-width:none}
  .kbd{display:none}

function parseDate(s){ const p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

let items = RAW.map((r,i)=>({
  id:'i'+i,
  type:r.t, title:r.ti, summary:r.s, source:r.src, author:r.by||'',
  tags:r.tags||[], savedAt:parseDate(r.dt),
  wordCount:r.w||0, duration:r.dur||'', size:r.size||'',
  status:r.st, rating:r.r||0, origin:'ai', processing:false,
}));

const state = {
  view:'home',                    // home | library | calendar | queue
  type:'all', tag:null, sieve:null, q:'',
  listView:'grid',
  sel:null,
  calYear: TODAY.getFullYear(),
  calMonth: TODAY.getMonth(),
  calDay: TODAY.getDate(),
  seed: 0,
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pal = i => PALETTES[Math.abs(i) % PALETTES.length];
const coverBg = i => { const p = pal(i); return 'linear-gradient(135deg,'+p[0]+' 0%,'+p[1]+' 100%)'; };
const key = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const WD = ['周一','周二','周三','周四','周五','周六','周日'];
const wdIdx = d => (d.getDay()+6)%7;
const alive = () => items.filter(x=>!x.deleted);

function rel(dt){
  const a = new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());
  const b = new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());
  const n = Math.round((b-a)/DAY);
  if(n<=0) return '今天';
  if(n===1) return '昨天';
  if(n<7) return n+' 天前';
  if(n<30) return Math.floor(n/7)+' 周前';
  return Math.floor(n/30)+' 个月前';
}

function countByDay(){
  const m = {};
  alive().forEach(x=>{ const k = key(x.savedAt); m[k]=(m[k]||0)+1; });
  return m;
}

function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0';
    setTimeout(()=>el.remove(),320); }, 2600);
}

  $('#btnFilter').style.display = hasSide ? '' : 'none';

  $('#dockNav').innerHTML = MAIN.map(m=>{
    const on = state.view===m.k;

/* ============ 日历页内侧栏 ============ */
function calSide(){
  const a = alive();
  const years = [...new Set(a.map(x=>x.savedAt.getFullYear()))].sort((x,y)=>y-x);
  if(!years.length) years.push(TODAY.getFullYear());

  let h = '<div class="nav-group"><div class="nav-title">年份</div>'+
    years.map(y=>'<button class="nav-item '+(state.calYear===y?'on':'')+'" data-cyear="'+y+'">'+
      '<span>'+y+'</span>'+
      '<span class="cnt">'+a.filter(x=>x.savedAt.getFullYear()===y).length+'</span></button>').join('')+
    '</div>';

  h += '<div class="nav-group"><div class="nav-title">月份</div>'+
    Array.from({length:12},(_,i)=>{
      const n = a.filter(x=>x.savedAt.getFullYear()===state.calYear && x.savedAt.getMonth()===i).length;
      const on = i===state.calMonth;
      const dim = n===0 && !on;
      return '<button class="nav-item '+(on?'on':'')+'" data-cymonth="'+i+'" '+
        (dim?'style="color:rgba(109,104,95,.5)"':'')+'>'+
        '<span>'+(i+1)+' 月</span><span class="cnt">'+(n||'')+'</span></button>';
    }).join('')+'</div>';

  const mCount = a.filter(x=>x.savedAt.getFullYear()===state.calYear && x.savedAt.getMonth()===state.calMonth).length;
  const cnt = countByDay();
  let busiest = null;
  Object.keys(cnt).forEach(k=>{
    const d = parseDate(k);
    if(d.getFullYear()===state.calYear && d.getMonth()===state.calMonth){
      if(!busiest || cnt[k]>cnt[busiest.k]) busiest = {k:k, n:cnt[k], d:d};
    }
  });
  h += '<div class="nav-group"><div class="nav-title">本月小结</div>'+
    '<div class="side-note">共 <b style="color:var(--text)">'+mCount+'</b> 条'+
      (busiest ? '<br>最勤的一天：'+(busiest.d.getMonth()+1)+'月'+busiest.d.getDate()+'日（'+busiest.n+' 条）' : '')+
    '</div></div>';
  return h;
}

function bigCard(x,i){
  const idx = items.indexOf(x);
  const extra = x.duration ? '<span class="dur">'+x.duration+'</span>'
              : (x.wordCount ? '<span class="dur">'+(x.wordCount/1000).toFixed(1)+'k 字</span>' : '');
  return '<div class="big-card" data-id="'+x.id+'" style="animation-delay:'+(i*50)+'ms">'+
    '<div class="cover" style="background:'+coverBg(idx+3)+'">'+
      '<span class="badge">'+TYPE_MAP[x.type]+'</span>'+extra+'</div>'+

      '<div class="card-title">'+esc(x.title)+'</div>'+

      '<div class="card-meta"><span>'+esc(x.source)+'</span><span class="sep"></span>'+
        '<span>'+rel(x.savedAt)+' 存的</span></div>'+
    '</div></div>';
}

function heatStrip(){
  const cnt = countByDay();
  const startOfWeek = new Date(TODAY.getTime() - wdIdx(TODAY)*DAY);
  const weeks = 26;
  let html = '<div class="heat-wrap"><div class="heat">';
  for(let w=0; w<weeks; w++){
    html += '<div class="heat-col">';
    for(let d=0; d<7; d++){
      const cur = new Date(startOfWeek.getTime() - (weeks-1-w)*7*DAY + d*DAY);
      if(cur > TODAY){ html += '<div class="heat-cell" style="visibility:hidden"></div>'; continue; }
      const c = cnt[key(cur)] || 0;
      const lv = c===0?'':(c===1?'l1':(c===2?'l2':(c<=4?'l3':'l4')));
      html += '<div class="heat-cell '+lv+'" title="'+key(cur)+' · '+c+' 条"></div>';
    }
    html += '</div>';
  }
  return html + '</div></div>';
}

/* ============ 资料库 ============ */
function filtered(){
  let r = alive();
  if(state.type!=='all') r = r.filter(x=>x.type===state.type);
  if(state.tag) r = r.filter(x=>x.tags.some(t=>t===state.tag || t.split('›')[0]===state.tag));
  if(state.sieve==='week'){
    const cut = new Date(TODAY.getTime()-7*DAY);
    r = r.filter(x=>x.savedAt>=cut);
  }
  if(state.sieve==='notag') r = r.filter(x=>x.tags.length===0);
  if(state.sieve==='star')  r = r.filter(x=>x.rating>=4);
  if(state.q.trim()){
    const q = state.q.trim().toLowerCase();
    r = r.filter(x=>(x.title+' '+x.summary+' '+x.tags.join(' ')+' '+x.source).toLowerCase().indexOf(q)>=0);
  }
  return r.sort((a,b)=>b.savedAt-a.savedAt);
}

  const head =

      '<span class="list-sub">'+list.length+' 条</span>'+
      '<span class="right">'+
        '<div class="seg">'+
          '<button data-lv="grid" class="'+(state.listView==='grid'?'on':'')+'">网格</button>'+
          '<button data-lv="tml" class="'+(state.listView==='tml'?'on':'')+'">时间轴</button>'+
        '</div>'+
      '</span>'+

  let body;

    body = '<div class="empty">这里还没有东西。<br>点右上角「+ 存一条」试试。</div>';

/* ============ 日历 ============ */
function pickDay(y,m){
  const cnt = countByDay();
  const days = new Date(y,m+1,0).getDate();
  const isCur = (y===TODAY.getFullYear() && m===TODAY.getMonth());
  if(isCur && cnt[key(TODAY)]) return TODAY.getDate();
  for(let d=days; d>=1; d--){ if(cnt[key(new Date(y,m,d))]) return d; }
  return isCur ? TODAY.getDate() : 1;
}

function renderCalendar(){
  const cnt = countByDay();
  const y = state.calYear, m = state.calMonth;

  const first = new Date(y,m,1);
  const offset = wdIdx(first);
  const days = new Date(y,m+1,0).getDate();
  if(state.calDay > days) state.calDay = days;
  if(state.calDay < 1) state.calDay = 1;
  const total = Math.ceil((offset+days)/7)*7;

  let cells = '';
  for(let i=0;i<total;i++){
    const dn = i - offset + 1;
    if(dn<1 || dn>days){ cells += '<div class="cal-cell blank"></div>'; continue; }
    const dt = new Date(y,m,dn);
    const c = cnt[key(dt)] || 0;
    const lv = c===0?'':(c===1?'l1':(c===2?'l2':(c<=4?'l3':'l4')));
    const isToday = dt.getTime()===TODAY.getTime();
    const isSel = dn===state.calDay;
    cells += '<div class="cal-cell '+lv+(isToday?' today':'')+(isSel?' sel':'')+'" data-day="'+dn+'">'+
      '<span class="cal-num">'+dn+'</span>'+(c?'<span class="cal-cnt">'+c+'</span>':'')+'</div>';
  }

  const selDate = new Date(y,m,state.calDay);
  const dayItems = alive().filter(x=>key(x.savedAt)===key(selDate)).sort((a,b)=>b.savedAt-a.savedAt);
  const listHTML = dayItems.length
    ? dayItems.map(x=>{
        const idx = items.indexOf(x);
        return '<div class="cal-row" data-id="'+x.id+'">'+
          '<div class="cal-thumb" style="background:'+coverBg(idx+3)+'"><span>'+TYPE_MAP[x.type]+'</span></div>'+
          '<div class="cal-row-body">'+
            '<div class="cal-row-title">'+esc(x.title)+'</div>'+
            '<div class="cal-row-meta">'+esc(x.source)+(x.tags.length?' · '+esc(x.tags[0]):'')+'</div>'+
          '</div></div>';
      }).join('')
    : '<div class="cal-empty">这一天没有存东西</div>';

  const mCount = alive().filter(x=>x.savedAt.getFullYear()===y && x.savedAt.getMonth()===m).length;

  $('#scroll').innerHTML =
    '<div class="page">'+
      '<aside class="page-side" id="pageSide">'+calSide()+'</aside>'+
      '<div class="page-main">'+
        '<div class="cal-wrap">'+
          '<div class="cal-card">'+
            '<div class="cal-monthhead"><span class="m">'+y+' 年 '+(m+1)+' 月</span>'+
              '<span class="n">共 '+mCount+' 条</span></div>'+
            '<div class="cal-weekhead">'+WD.map(w=>'<span>'+w+'</span>').join('')+'</div>'+
            '<div class="cal-grid">'+cells+'</div>'+
          '</div>'+
          '<div class="cal-side">'+
            '<div class="cal-side-head"><span class="cal-side-date">'+(m+1)+' 月 '+state.calDay+' 日</span>'+
              '<span class="cal-side-cnt">'+dayItems.length+' 条</span></div>'+
            '<div class="cal-list">'+listHTML+'</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
}

/* ============ 卡片 ============ */
function cardHTML(x, idx){
  if(x.processing){
    return '<div class="card processing">'+
      '<div class="cover"><div class="proc-label"><span class="spin"></span>正在抓取…</div></div>'+
      '<div class="card-body">'+
        '<div class="card-title skeleton" style="border-radius:4px"></div>'+
        '<div class="card-sum skeleton" style="border-radius:4px;margin-top:8px"></div>'+
        '<div class="card-meta skeleton" style="border-radius:4px;height:11px;margin-top:12px;width:60%"></div>'+
      '</div></div>';
  }
  const tags = x.tags.length
    ? x.tags.slice(0,3).map(t=>'<span class="tag '+(x.origin==='ai'?'ai':'')+'">'+esc(t.split('›')[1]||t)+'</span>').join('')
    : '<span class="tag none">待归类</span>';
  const extra = x.duration ? '<span class="dur">'+x.duration+'</span>'
              : (x.wordCount ? '<span class="dur">'+(x.wordCount/1000).toFixed(1)+'k 字</span>'
              : (x.size ? '<span class="dur">'+x.size+'</span>' : ''));
  return '<div class="card" data-id="'+x.id+'" style="animation-delay:'+Math.min(idx*18,220)+'ms">'+
    '<div class="cover" style="background:'+coverBg(idx+3)+'">'+
      '<span class="badge">'+TYPE_MAP[x.type]+'</span>'+extra+'</div>'+
    '<div class="card-body">'+
      '<div class="card-title">'+hl(x.title)+'</div>'+
      '<div class="card-sum">'+hl(x.summary||'—')+'</div>'+
      '<div class="card-tags">'+tags+'</div>'+
      '<div class="card-meta"><span>'+esc(x.source)+'</span><span class="sep"></span>'+
        '<span>'+rel(x.savedAt)+'</span>'+
        (x.status==='read'?'<span class="sep"></span><span>已读</span>':'')+'</div>'+
    '</div></div>';
}

function hl(s){
  s = esc(s);
  const q = state.q.trim();
  if(!q) return s;
  try{
    return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  }catch(e){ return s; }
}

function render(){
  renderShell();
  if(state.view==='home') renderHome();
  else if(state.view==='calendar') renderCalendar();
  else if(state.view==='queue') renderQueue();
  else renderLibrary();
}

/* ============ 详情抽屉 ============ */
function openDetail(id){
  const x = items.find(i=>i.id===id);
  if(!x) return;
  const idx = items.indexOf(x);
  const tagHTML = x.tags.length
    ? x.tags.map(t=>'<span class="tag ai">'+esc(t)+'</span>').join('')
    : '<span class="tag none">没归好类</span>';
  const props = [
    ['类型', TYPE_MAP[x.type]],
    ['来源', x.source],
    x.author ? ['作者', x.author] : null,
    x.duration ? ['时长', x.duration] : null,
    x.wordCount ? ['字数', x.wordCount.toLocaleString()+' 字'] : null,
    x.size ? ['大小', x.size] : null,
    ['收藏于', key(x.savedAt)+'（'+rel(x.savedAt)+'）'],
    ['状态', x.status==='read'?'已读':'未读'],
    ['评分', x.rating ? '★'.repeat(x.rating)+'☆'.repeat(5-x.rating) : '未评'],
  ].filter(Boolean);

  const relList = items.filter(i=>i.id!==x.id && i.tags.some(t=>x.tags.indexOf(t)>=0)).slice(0,3);
  const relHTML = relList.length
    ? relList.map(i=>'<div style="padding:6px 0;border-bottom:1px solid var(--border);color:var(--dim)">· '+esc(i.title)+'</div>').join('')
    : '暂时没有同类内容';

  $('#drawerContent').innerHTML =
    '<div class="d-cover" style="background:'+coverBg(idx+3)+'">'+
      '<button class="d-close" id="dClose">×</button></div>'+
    '<div class="d-body">'+
      '<div class="d-title">'+esc(x.title)+'</div>'+
      '<div class="d-meta"><span>'+TYPE_MAP[x.type]+'</span><span class="sep"></span>'+
        '<span>'+esc(x.source)+'</span><span class="sep"></span>'+
        '<span>'+rel(x.savedAt)+' 收藏</span></div>'+
      (x.summary?'<div class="d-sect-title">摘要</div><div class="d-sum">'+esc(x.summary)+'</div>':'')+
      '<div class="d-sect-title">标签</div>'+
      '<div class="d-tags">'+tagHTML+'<span class="tag add">+ 添加</span></div>'+
      '<div class="d-sect-title">属性</div>'+
      '<table class="props">'+props.map(p=>'<tr><td>'+p[0]+'</td><td>'+esc(p[1])+'</td></tr>').join('')+'</table>'+
      '<div class="d-sect-title">改类型（改一次会记住来源）</div>'+
      '<select class="type-sel" id="typeSel">'+
        TYPES.map(t=>'<option value="'+t.k+'" '+(t.k===x.type?'selected':'')+'>'+t.label+'</option>').join('')+
      '</select>'+
      '<div class="d-actions">'+
        '<button class="btn-primary" id="dOpen">打开原文</button>'+
        '<button class="btn-line" id="dRead">'+(x.status==='read'?'标为未读':'标为已读')+'</button>'+
        '<button class="btn-line" id="dStar">打星</button>'+
        '<button class="btn-line danger" id="dDel">删除</button>'+
      '</div>'+
      '<div class="d-sect-title">同标签的其它内容</div>'+
      '<div style="font-size:12.5px;color:var(--dim2)">'+relHTML+'</div>'+
    '</div>';

  $('#mask').classList.add('on');
  $('#drawer').classList.add('on');

  $('#dClose').onclick = closeDetail;
  $('#dOpen').onclick = ()=>toast('Demo 里不真的打开外部链接');
  $('#dRead').onclick = ()=>{
    x.status = x.status==='read'?'unread':'read';
    toast(x.status==='read'?'已标为已读':'已标为未读');
    render(); openDetail(id);
  };
  $('#dStar').onclick = ()=>{
    x.rating = x.rating>=5?0:x.rating+1;
    toast(x.rating?'评分：'+x.rating+' 星':'已取消评分');
    render(); openDetail(id);
  };
  $('#dDel').onclick = ()=>{
    x.deleted = true; closeDetail(); render(); toast('已删除（可恢复）');
  };
  $('#typeSel').onchange = (e)=>{
    x.type = e.target.value;
    toast('已改为「'+TYPE_MAP[x.type]+'」，并记住：'+x.source+' → '+TYPE_MAP[x.type]);
    render(); openDetail(id);
  };
}

function closeDetail(){
  $('#mask').classList.remove('on');
  $('#drawer').classList.remove('on');
  state.sel = null;
}

const SAMPLE_TITLES = [
  '把「第二大脑」拆开看：它到底解决了什么',
  '一个人如何做出 100 分的落地页',
  '关于时间管理，我最后只留下了三条规则',
  '为什么你的收藏夹永远在吃灰',
];
const SAMPLE_SUMS = [
  '作者认为所有知识管理工具都在回答同一个问题：半年后你还找得到吗。其余都是装饰。',
  '从信息密度、信任感、行动指引三个角度拆。文末附了十二个真实案例的对比。',
];
let sampleI = 0;

function addItem(url){
  const id = 'n'+(Date.now()%100000);
  const host = (url||'').replace(/^https?:\/\//,'').split('/')[0];
  items.unshift({
    id:id, type:'article', title:'', summary:'', source:host||'待识别',
    author:'', tags:[], savedAt:new Date(), status:'unread', rating:0,
    origin:'ai', processing:true, wordCount:0, duration:'', size:'',
  });
  state.view='library'; state.type='all'; state.tag=null; state.sieve=null; state.q='';
  state.listView='grid';
  $('#q').value='';
  render();
  $('#scroll').scrollTop = 0;

  setTimeout(()=>{
    const it = items.find(x=>x.id===id);
    if(!it) return;
    it.processing = false;
    it.title = SAMPLE_TITLES[sampleI % SAMPLE_TITLES.length];
    it.summary = SAMPLE_SUMS[sampleI % SAMPLE_SUMS.length];
    it.author = '模拟作者';
    it.tags = ['AI相关','学点东西'];
    it.wordCount = 3800 + (sampleI*700)%2600;
    sampleI++;
    render();
    toast('已自动归类：文章 · AI相关 / 学点东西');
  }, 2400);
}

/* ============ 事件 ============ */
function openSide(){ const s=$('#pageSide'); if(s) s.classList.add('on'); $('#sideMask').classList.add('on'); }
function closeSide(){ const s=$('#pageSide'); if(s) s.classList.remove('on'); $('#sideMask').classList.remove('on'); }

document.addEventListener('click', e=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){
    const p = nav.dataset.nav.split(':');
    const kind = p[0], val = p.slice(1).join(':');
    if(kind==='view'){
      state.view = val;
      if(val==='calendar') state.calDay = pickDay(state.calYear, state.calMonth);
    }
    if(kind==='type'){ state.view='library'; state.type=val; state.tag=null; state.sieve=null; }
    if(kind==='tag'){ state.view='library'; state.tag = state.tag===val?null:val; state.type='all'; state.sieve=null; }
    if(kind==='sieve'){ state.view='library'; state.sieve = state.sieve===val?null:val; state.type='all'; state.tag=null; }
    $('#scroll').scrollTop = 0;
    render(); closeSide(); return;
  }

  const cy = e.target.closest('[data-cyear]');
  if(cy){ state.calYear = +cy.dataset.cyear; state.calDay = pickDay(state.calYear, state.calMonth); renderCalendar(); closeSide(); return; }

  const cm = e.target.closest('[data-cymonth]');
  if(cm){ state.calMonth = +cm.dataset.cymonth; state.calDay = pickDay(state.calYear, state.calMonth); renderCalendar(); closeSide(); return; }

  const day = e.target.closest('[data-day]');
  if(day){ state.calDay = +day.dataset.day; renderCalendar(); return; }

  const row = e.target.closest('.cal-row[data-id]');
  if(row){ openDetail(row.dataset.id); return; }

  const card = e.target.closest('.card[data-id], .big-card[data-id]');
  if(card){ openDetail(card.dataset.id); return; }

  if(e.target.id==='btnShuffle'){ state.seed++; renderHome(); return; }
  if(e.target.id==='btnToCal'){ state.view='calendar'; state.calDay = pickDay(state.calYear, state.calMonth); render(); return; }

  const lv = e.target.closest('[data-lv]');
  if(lv){ state.listView = lv.dataset.lv; renderLibrary(); return; }
});

$('#q').addEventListener('input', e=>{
  const v = e.target.value;
  /* 顶栏搜索是全局的：一旦开始输入，就放开侧栏的筛选，避免"明明有却搜不到" */
  if(v && (state.type!=='all' || state.tag || state.sieve)){
    state.type='all'; state.tag=null; state.sieve=null;
  }
  state.q = v;
  if(state.view!=='library') state.view='library';
  render();
});

$('#mask').onclick = closeDetail;
$('#btnFilter').onclick = openSide;
$('#sideMask').onclick = closeSide;

$('#btnAdd').onclick = ()=>{
  $('#modalMask').classList.add('on');
  setTimeout(()=>$('#urlInput').focus(), 60);
};
$('#btnCancel').onclick = ()=>$('#modalMask').classList.remove('on');
$('#modalMask').onclick = e=>{ if(e.target.id==='modalMask') $('#modalMask').classList.remove('on'); };
$('#btnSubmit').onclick = ()=>{
  const v = $('#urlInput').value.trim();
  $('#urlInput').value = '';
  $('#modalMask').classList.remove('on');
  addItem(v || 'https://mp.weixin.qq.com/s/demo');
};

document.addEventListener('keydown', e=>{
  const tag = document.activeElement.tagName;
  if(e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA'){
    e.preventDefault(); $('#q').focus();
  }
  if(e.key === 'Escape'){
    closeDetail();
    $('#modalMask').classList.remove('on');
    closeSide();
  }
  if(e.key === 'Enter' && $('#modalMask').classList.contains('on') && tag === 'TEXTAREA'){
    $('#btnSubmit').click();
  }
});

render();
</script>
</body>
</html>
