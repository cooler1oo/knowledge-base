# 架构边界规则（声明式）。执行器：python -m tools.eng_checks --arch
# 换项目只改这个文件，执行器不动。

# 扫哪些目录（相对仓库根）
dirs = ["kb", "tools", "scripts"]

# 只有这些前缀下的文件可以出现写库 SQL；其余一律拦
write_sql_allowed_prefixes = ["kb/store/"]

# 这些层不得 import 数据库层
[[import_deny]]
path_prefix = "kb/extract/"
layer = "抓取层"
modules = ["kb.store"]

[[import_deny]]
path_prefix = "kb/ai/"
layer = "AI 层"
modules = ["kb.store"]

# 视觉层与抓取层、AI 层同构：出的是帧与时间区间，落库由调用方经 store 做。
# 不登记时 kb/vision/ 只剩「写库 SQL」与「直连驱动」两条规则生效，
# 「import kb.store」这条会静默漏检。
[[import_deny]]
path_prefix = "kb/vision/"
layer = "视觉层"
modules = ["kb.store"]

# 媒体层：出的是磁盘上的字节，落库由 worker 经 kb.store.attachments 做。
# 与视觉层同构——**必须显式登记**，不登记时本层只剩「写库 SQL」与「直连驱动」
# 两条规则生效，「import kb.store」这条会静默漏检。
[[import_deny]]
path_prefix = "kb/media/"
layer = "媒体层"
modules = ["kb.store"]

# 检索层：出的是「一条文档该长什么样」与「一次搜索该按什么规则算」。
# 兜底 SQL 在 `kb/store/search.py`，由 api/worker 注入成可调用对象传进来。
#
# **必须显式登记**：不登记时本层只剩「写库 SQL」与「直连驱动」两条规则生效，
# 「import kb.store」这条会静默漏检。而检索层恰好是最容易图省事直接查库的地方
# ——`SearchService` 要拿到兜底结果，最直觉的写法就是 `from kb.store import search`。
# 那条写法会让「纯逻辑层不碰数据库」这条边界当场失效，且不会有任何报错。
[[import_deny]]
path_prefix = "kb/search/"
layer = "检索层"
modules = ["kb.store"]

# 谁都不许绕过 store 直连数据库驱动。api 层今天只 import kb.store.db.Pool，
# 一旦有人图省事直接 import pg8000，store 这层边界就形同虚设。
[[driver_deny]]
modules = ["pg8000", "psycopg", "psycopg2", "sqlite3"]
allowed_prefixes = ["kb/store/"]
