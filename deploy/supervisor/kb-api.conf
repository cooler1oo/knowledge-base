[program:kb-api]
command=/opt/kb-venv/bin/python -m kb.api --host 0.0.0.0 --port 8000
directory=/opt/kb-app
; KB_MEILI_KEY 必须配：`/api/search` 要带 `Authorization` 头才不会被判 401。
; 不配的后果不是报错，而是**静默降级**——每次搜索返回
; `searchMode: "fallback"`（`degraded: true`），看起来「能用」，
; 但结果与相关度排序全丢了。2026-11-28 真机踩过：api 进程没有 key，
; 四组 curl 全部走兜底，而只有 `searchMode` 字段能看出来。
;
; KB_MEILI_URL 用默认值（http://127.0.0.1:7700）：api 与 Meili 在同一个
; proot 容器里。写死在这里而不是靠默认值，是为了让「改了地址」在配置里可见。
environment=PYTHONPATH="/opt/kb-app",KB_PG_USER="u0_a201",KB_PG_DATABASE="kb",KB_BCRYPT_ROUNDS="12",KB_MEILI_URL="http://127.0.0.1:7700",KB_MEILI_KEY="atd5HCnkgP1oGUSJeYqene2xNu9fYIlj",HTTP_PROXY="",HTTPS_PROXY="",ALL_PROXY="",http_proxy="",https_proxy=""
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/kb-api.log
stderr_logfile=/var/log/kb-api.err.log