[program:kb-worker]
command=/opt/kb-venv/bin/python -m kb.worker --idle 2
directory=/opt/kb-app
; KB_MEILI_KEY 必须配：Meili 在生产密钥下对无 key 的写请求返回 401，
; 而 401 的处置是「defer 600 秒 + 提示检查 KB_MEILI_KEY」——
; 不配的话每条内容的索引步永远推迟，搜索页只是「搜不到新内容」。
;
; KB_MEILI_URL 与 kb-api.conf 必须**逐字相同**：索引写进 A 而搜索查 B 时，
; 两边都健康、都不报错，只是搜索结果里永远没有新内容。
;
; HTTP_PROXY 等四个置空：容器里可能残留代理变量，`httpx` 的
; `trust_env=False` 已挡住检索路径，但 worker 里还有 media 相关的下载走
; 别的客户端（`kb/media/fetch.py`），那条路径仍读环境变量。
; 127.0.0.1 被代理转发会表现为「Meili / 上游站点都挂了」，两个信号一起错。
environment=PYTHONPATH="/opt/kb-app",KB_PG_USER="u0_a201",KB_PG_DATABASE="kb",KB_MEILI_URL="http://127.0.0.1:7700",KB_MEILI_KEY="atd5HCnkgP1oGUSJeYqene2xNu9fYIlj",HTTP_PROXY="",HTTPS_PROXY="",ALL_PROXY="",http_proxy="",https_proxy=""
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/kb-worker.log
stderr_logfile=/var/log/kb-worker.err.log