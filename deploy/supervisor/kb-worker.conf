[program:kb-worker]
command=/opt/kb-venv/bin/python -m kb.worker --idle 2
directory=/opt/kb-app
environment=PYTHONPATH="/opt/kb-app",KB_PG_USER="u0_a201",KB_PG_DATABASE="kb"
