# ① 提交前检查：在自己电脑上跑，几秒内完事。
# 不用远程 hook 仓库（这里访问 GitHub 不稳定），改成 local + PyPI 安装，
# 版本固定在一个地方，和 pyproject.toml 里装的一致。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --force-exclude
        language: python
        additional_dependencies: ["ruff==0.17.6"]
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: python
        additional_dependencies: ["ruff==0.17.6"]
        types: [python]
      - id: mypy
        name: mypy 类型检查
        # 必须用项目环境（language: system），不能用隔离环境：
        # 隔离环境里只有 mypy，没有 bcrypt/starlette/pg8000，这些库会退化成 Any，
        # 于是 `return bcrypt.hashpw(...).decode()` 被判「返回 Any」——假红。
        # 2026-11-27 实测：本地（有 bcrypt，py.typed）通过，钩子隔离环境报 2 处。
        entry: python -m mypy kb tools
        language: system
        files: ^(kb|tools)/.*\.py$
        pass_filenames: false
      - id: arch-boundaries
        name: 架构边界（只有 store 能写库等）
        entry: python -m tools.eng_checks --arch
        language: system
        files: ^kb/.*\.py$
        pass_filenames: false
      - id: commit-size
        name: 提交大小（防一次塞一坨）
        entry: python -m tools.eng_checks --staged
        language: system
        pass_filenames: false
      # 规矩不写在文档里靠人记，写成这条钩子：暂存了文档就必须过检查
      - id: doc-checks
        name: 文档规则（只查暂存文档）
        entry: python -m tools.doc_checks --staged
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
      - id: commit-message
        name: 提交信息（格式 + 正文 + 必须写验证）
        entry: python -m tools.eng_checks --commit-msg
        language: system
        stages: [commit-msg]
      - id: prepush-clean
        name: 推送前工作区必须干净
        entry: python -m tools.eng_checks --pre-push
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
