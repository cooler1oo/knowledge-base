# ① 提交前检查：在自己电脑上跑，几秒内完事。
# 不用远程 hook 仓库（这里访问 GitHub 不稳定），改成 local + PyPI 安装，
# 版本固定在一个地方，和 pyproject.toml 里装的一致。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --force-exclude
        language: python
        additional_dependencies: ["ruff==0.17.6"]
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: python
        additional_dependencies: ["ruff==0.17.6"]
        types: [python]
      - id: mypy
        name: mypy 类型检查
        # 必须用项目环境（language: system），不能用隔离环境：
        # 隔离环境里只有 mypy，没有 bcrypt/starlette/pg8000，这些库会退化成 Any，
        # 于是 `return bcrypt.hashpw(...).decode()` 被判「返回 Any」——假红。
        # 2026-11-27 实测：本地（有 bcrypt，py.typed）通过，钩子隔离环境报 2 处。
        entry: python -m mypy kb tools
        language: system
        files: ^(kb|tools)/.*\.py$
        pass_filenames: false
      - id: arch-boundaries
        name: 架构边界（只有 store 能写库等）
        entry: python -m tools.eng_checks --arch
        language: system
        files: ^kb/.*\.py$
        pass_filenames: false
      - id: commit-size
        name: 提交大小（防一次塞一坨）
        entry: python -m tools.eng_checks --staged
        language: system
        pass_filenames: false
      # 2026-11-28 事故：R6 七个任务全交付并推送，任务总表一行没标 done。
      # 根因不是「忘了看一眼」，是「把表当参考资料，而它是工程顺序的唯一权威」。
      # 所以不写「请记得更新表格」，写成钩子：动了 kb/ 或 tools/ 却没动表格就提交不上。
      # 挂在 --staged 里（上面那条），因为它已经拿到了暂存文件列表。
      # 另加一条独立检查：未提交时也能手动跑 `--task-table` 查表格与代码事实是否自洽。
      # 规矩不写在文档里靠人记，写成这条钩子：暂存了文档就必须过检查
      - id: doc-checks
        name: 文档规则（只查暂存文档）
        entry: python -m tools.doc_checks --staged
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
      - id: commit-message
        name: 提交信息（格式 + 正文 + 必须写验证）
        entry: python -m tools.eng_checks --commit-msg
        language: system
        stages: [commit-msg]
      # ruff format 默认只认 types: [python]，Markdown 里 ```python 代码块的排版
      # 本地不查、CI 的 `ruff format --check .` 却查。2026-11-27 因此红过一次
      # （1855d1b：交接包里的代码块注释对齐多两个空格），本地全绿 CI 红，
      # 差别只在扫描范围。这条钩子把口径拉齐到 CI，改动任何 md 都跑一次。
      - id: ruff-format-docs
        name: 文档里的 Python 代码块格式（与 CI 同口径）
        entry: ruff format --check .
        language: system
        files: \.md$
        pass_filenames: false
      - id: prepush-clean
        name: 推送前工作区必须干净
        entry: python -m tools.eng_checks --pre-push
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
