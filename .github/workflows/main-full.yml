# ③ 合进默认分支之后：全部检查 + 全部测试（含慢测试）。
# 红了不回滚，直接再提交一个修复（往前修）。发布只从全绿的提交里挑。
name: 主分支全量检查

on:
  push:
    branches: [main]

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 规则检查
        run: |
          ruff check .
          ruff format --check .
      - name: 文档规则（全量 + P0 覆盖 + 引用检查）
        run: python -m tools.doc_checks --all --cross-refs
      - name: 全部测试（含慢测试）
        # 慢测试里的联网核对要查 GitHub 星数与许可。
        # 用 secrets.GITHUB_TOKEN（Actions 自动提供，5000/小时）；
        # 不传则走匿名 60/小时，容易打满后 skip。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pytest
