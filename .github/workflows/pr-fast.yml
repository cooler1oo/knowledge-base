# ② 开 PR 时：先查规矩，再只跑和这次改动相关的测试。要快。
name: PR 快检查

on:
  pull_request:

jobs:
  fast:
    # 攒批的 PR（batch/N）走批次重检查，这里跳过；两种做法可以并存
    if: ${{ !startsWith(github.head_ref, 'batch/') }}
    runs-on: ubuntu-latest
    # 限时 5 分钟（建议值）。超时说明测试太慢：优化测试或挪到 ③，不加机器。
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要完整历史，才能算出这次改了哪些文件
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 规则检查（和 ① 一样，防止有人跳过本地钩子）
        run: |
          ruff check .
          ruff format --check .
      - name: 类型检查
        run: mypy kb tools
      - name: 架构边界（只有 store 能写库等）
        run: python -m tools.eng_checks --arch
      - name: 文档规则（只查这次改动的文档）
        run: python -m tools.doc_checks --changed "origin/${{ github.base_ref }}"
      - name: 只跑和这次改动相关的测试
        run: python scripts/related_tests.py "origin/${{ github.base_ref }}"
